## Drupal-specific nginx rules for webdevops/php-nginx

# Image styles: pass to Drupal for on-the-fly generation
location ~ ^/sites/.*/files/styles/ {
    try_files $uri @index;
}

# Private files: always go through Drupal
location ~ ^/sites/.*/files/private/ {
    internal;
}

# Block access to PHP files in directories
location ~ \..*/.*\.php$ {
    return 403;
}

# Block hidden files/dirs (except .well-known)
location ~ (^|/)\. {
    return 403;
}

# Clean URLs: send all non-file requests to Drupal
location @index {
    rewrite ^ /index.php;
}
