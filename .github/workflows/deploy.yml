name: Deploy to Host Europe

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_PATH: /home/d9wk9gxzatk4/public_html
  SITE_NAME: www_hpm_drupal
  REPO_URL: git@github.com:lowbits/hpm-website-v2.git
  KEEP_RELEASES: 3

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/themes/custom/hpm/package-lock.json

      - name: Build theme assets
        working-directory: web/themes/custom/hpm
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy release
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          RELEASE=$(date +%Y-%m-%d-%H%M%S)
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          # Create directory structure (first deploy only)
          # Create dirs + free disk space before cloning
          $SSH_CMD << INIT
          mkdir -p ${BASE_PATH}/releases
          mkdir -p ${BASE_PATH}/shared/files
          mkdir -p ${BASE_PATH}/shared/private

          echo "==> Cleaning up old releases..."
          CURRENT_RELEASE=\$(readlink -f ${BASE_PATH}/${SITE_NAME} 2>/dev/null || echo "")
          cd ${BASE_PATH}/releases
          for dir in */; do
            FULL=\$(readlink -f "\$dir")
            if [ "\$FULL" != "\$CURRENT_RELEASE" ]; then
              echo "    Removing \$dir"
              rm -rf "\$dir"
            fi
          done
          INIT

          # Clone repo into new release directory
          $SSH_CMD << CLONE
          cd ${BASE_PATH}/releases
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_github_deploy -o StrictHostKeyChecking=no" \
            git clone --depth 1 --branch main ${REPO_URL} ${RELEASE}
          rm -rf ${RELEASE}/.git
          CLONE

          # Upload built theme assets
          rsync -azP \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            web/themes/custom/hpm/css/dist/ \
            "${SSH_USER}@${SSH_HOST}:${BASE_PATH}/releases/${RELEASE}/web/themes/custom/hpm/css/dist/"

          rsync -azP \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            web/themes/custom/hpm/js/dist/ \
            "${SSH_USER}@${SSH_HOST}:${BASE_PATH}/releases/${RELEASE}/web/themes/custom/hpm/js/dist/"

          # Install dependencies, create symlinks, run deploy tasks
          $SSH_CMD << DEPLOY
          set -e
          RELEASE_PATH=${BASE_PATH}/releases/${RELEASE}
          SHARED_PATH=${BASE_PATH}/shared

          cd \${RELEASE_PATH}

          # Symlink shared files
          rm -rf web/sites/default/files
          ln -s \${SHARED_PATH}/files web/sites/default/files

          ln -sf \${SHARED_PATH}/settings.local.php web/sites/default/settings.local.php

          rm -rf private
          ln -s \${SHARED_PATH}/private private

          # Install Composer dependencies
          echo "==> Installing Composer dependencies..."
          mkdir -p /home/d9wk9gxzatk4/tmp
          export TMPDIR=/home/d9wk9gxzatk4/tmp
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

          # Add PHP handler for LiteSpeed (.htaccess)
          sed -i '1i\\<FilesMatch "\\\\.(php4|php5|php3|php2|php|phtml)\$">\\nSetHandler application/x-httpd-alt-php83___lsphp\\n</FilesMatch>' web/.htaccess

          # Switch symlink to new release
          ln -sfn \${RELEASE_PATH} ${BASE_PATH}/${SITE_NAME}
          echo "==> Symlink switched to ${RELEASE}"

          # Run Drupal deploy tasks
          cd \${RELEASE_PATH}
          if ./vendor/bin/drush status --field=bootstrap 2>/dev/null | grep -q "Successful"; then
            # Always disable maintenance mode, even if a step fails
            trap './vendor/bin/drush state:set system.maintenance_mode 0 --input-format=integer && echo "==> Maintenance mode disabled."' EXIT

            echo "==> Enabling maintenance mode..."
            ./vendor/bin/drush state:set system.maintenance_mode 1 --input-format=integer

            echo "==> Running database updates..."
            ./vendor/bin/drush updatedb -y

            echo "==> Importing config..."
            ./vendor/bin/drush config:import -y

            echo "==> Rebuilding cache..."
            ./vendor/bin/drush cache:rebuild

            echo "==> Warming caches (entity + CDN)..."
            ./vendor/bin/drush warmer:enqueue entity,cdn --run-queue -l https://www.hoecker-pm.com || true

            echo "==> Deploy complete!"
          else
            echo "==> Drupal not yet installed — skipping deploy tasks."
          fi

          echo "==> All done."
          DEPLOY
